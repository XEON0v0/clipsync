<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- app-icon background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#gloss)"/>

  <!-- sync ring behind the board -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="52" stroke-linecap="round">
    <path d="M 182.0 453.8 A 335 335 0 0 1 842.0 453.8"/>
    <path d="M 842.0 570.2 A 335 335 0 0 1 182.0 570.2"/>
  </g>
  <path d="M 854.2 521.1 L 791.7 452.0 L 889.0 434.6 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M 169.8 503.1 L 232.4 571.9 L 135.1 589.5 Z" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- board drop shadow -->
  <rect x="332" y="296" width="360" height="480" rx="34" fill="#241A5E" fill-opacity="0.32" filter="url(#soft)"/>

  <!-- clipboard board -->
  <rect x="332" y="272" width="360" height="480" rx="34" fill="#FFFFFF"/>

  <!-- clip -->
  <rect x="412" y="232" width="200" height="100" rx="42" fill="url(#bg)"/>
  <circle cx="512" cy="278" r="19" fill="#FFFFFF"/>

  <!-- content lines -->
  <g fill="#C9D6F2">
    <rect x="392" y="424" width="240" height="26" rx="13"/>
    <rect x="392" y="512" width="240" height="26" rx="13"/>
    <rect x="392" y="600" width="150" height="26" rx="13"/>
  </g>
</svg>
